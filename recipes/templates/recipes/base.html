<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Кулинарная книга{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'index' %}">🍳 Кулинарная книга</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'index' %}">Все рецепты</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'add_recipe' %}">Добавить рецепт</a>
        </li>
        {# Задание 5: добавить ссылку «Избранное» #}
      </ul>
      <form class="d-flex ms-3" method="get" action="{% url 'search' %}">
        <input class="form-control me-2" type="search" name="q" placeholder="Поиск рецептов..." value="{{ query }}">
        <button class="btn btn-outline-light" type="submit">🔍</button>
      </form>
    </div>
  </div>
</nav>

<div class="container pb-5">
  {% block content %}{% endblock %}
</div>

<footer class="text-center text-muted py-3 border-top bg-white mt-4">
  <small>Кулинарная книга &copy; 2024</small>
</footer>

</body>
</html>
